# Spoof Generation Configuration — LARGE TEST (OpenVoice V2 only)
# =================================================================
# Purpose: bring the OpenVoice V2 sample count up to ~100 spoofs so
# the xtts_v2 vs openvoice_v2 detector-EER comparison is less
# preliminary. Prior runs (small + medium) already produced 35
# openvoice_v2 files across 7 speakers (pvc07, pvc09, pvc12, pvc13,
# pvc15, pvc16, pvc17); this run adds ~65 more from the next
# eligible speakers.
#
# Sizing (with resume-skip logic):
#   max_speakers = 20 alphabetically eligible speakers
#     (>= n_ref + max_utts = 3 + 5 = 8 valid utterances)
#   - first 7 already have 5 openvoice files each -> skipped
#   - next 13 will each generate 5 -> ~65 new files
#   Manifest goes from ~451 -> ~516; openvoice_v2 rows go 35 -> 100.
#
# Run in the `openvoice` conda env:
#   conda activate openvoice
#   python scripts/02_generate_spoofs.py --config configs/spoof_gen.large.yaml
#
# Manifest merge is safe: all existing rows (416 xtts_v2 + 35
# openvoice_v2) are preserved; only new entries are appended.

paths:
  decte_audio_dir: "data/01_chunks"
  decte_metadata: "data/decte/metadata/speaker_info_by_audio.json"
  decte_transcripts_dir: "data/01_chunk_transcripts"
  vctk_audio_dir: "data/vctk/wav48_silence_trimmed"
  output_dir: "data/generated_spoofs"

audio:
  target_sr: 16000
  max_duration_sec: 15.0
  min_duration_sec: 2.0
  mono: true

generators:
  xtts_v2:
    enabled: false            # OpenVoice-only for this test

  openvoice_v2:
    enabled: true
    converter_ckpt_dir: "checkpoints/openvoice_v2/converter"
    base_speaker_ses_path: "checkpoints/openvoice_v2/base_speakers/ses/en-us.pth"
    melo_language: "EN"
    melo_speaker_key: "EN-US"
    device: "cuda"

protocol:
  max_speakers: 20                   # <-- first 7 already covered -> ~13 new
  max_utterances_per_speaker: 5      # <-- 5 utts each -> ~65 new attempts
  reference_utterance_count: 3
  seed: 42

speaker_metadata_fields:
  - speaker_id
  - gender
  - age_group
  - ses_class
  - recording_era
