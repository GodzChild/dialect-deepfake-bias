# Baseline detector configuration

detectors:
  aasist:
    enabled: true

    # Baseline AuralGuard-AASIST checkpoint.
    # The checkpoint itself is not committed to this repository.
    checkpoint_path: "checkpoints/aasist/baseline_best.pt"

    # Local copy of the model definition used by the detector wrapper.
    model_module_path: "checkpoints/aasist/model_code"

    device: "cuda"
    target_sr: 16000
