# Mitigation v1 detector configuration
#
# This checkpoint comes from the frozen-backbone DECTE fine-tuning run.
# It uses the same model architecture as the baseline, but different weights.

detectors:
  aasist:
    enabled: true
    checkpoint_path: "checkpoints/mitigation_v1_decte_finetune/best.pt"
    model_module_path: "checkpoints/aasist/model_code"
    device: "cuda"
    target_sr: 16000
