# Mitigation v2 detector configuration
#
# This checkpoint comes from the partial-backbone DECTE fine-tuning run.
# The final heterogeneous-GAT stage and task heads were allowed to update.
#
# Training settings used for the thesis run:
#   lr: 3e-5
#   epochs: 5
#   batch size: 4

detectors:
  aasist:
    enabled: true
    checkpoint_path: "checkpoints/mitigation_v2_partial_unfreeze/best.pt"
    model_module_path: "checkpoints/aasist/model_code"
    device: "cuda"
    target_sr: 16000
